<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arafer na Obra &mdash; Desvio de Entulho</title>
<style>
  :root{
    --orange:#f0821e;
    --orange-lt:#ffa94d;
    --dark:#12141c;
    --dark2:#1b1f2b;
    --line:#2b3242;
    --cream:#e9edf4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 50% -10%, #26303f 0%, rgba(18,20,28,0) 70%),
      var(--dark);
    color:var(--cream);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 12px 26px;
    overflow-x:hidden;
  }
  .hazard{
    height:7px; width:100%;
    background:repeating-linear-gradient(45deg, var(--orange) 0 10px, #1a1d27 10px 20px);
    opacity:.9;
  }
  header{width:auto; max-width:1440px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:10px 2px 8px;}
  .brand{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .logo{width:26px; height:26px; border-radius:6px; background:var(--orange); display:grid; place-items:center; color:#16181f; font-weight:900; font-size:15px; box-shadow:0 0 0 2px #0c0e14 inset;}
  header h1{font-size:15px; margin:0; letter-spacing:.14em; font-weight:800; text-transform:uppercase;}
  header .meta{font-size:11px; letter-spacing:.12em; color:#7b8699; text-transform:uppercase; white-space:nowrap;}
  header .meta b{color:var(--orange);}

  #stage{
    position:relative; width:100%; max-width:1440px; flex:0 0 auto;
    border-radius:10px; overflow:hidden;
    background:#0d1017;
    box-shadow: 0 0 0 1px var(--line), 0 22px 50px -20px #000;
    line-height:0;
    touch-action:manipulation;
  }
  canvas{display:block; margin:0 auto; image-rendering:pixelated; image-rendering:crisp-edges;}

  #hud{
    position:absolute; inset:6px 10px auto 10px; line-height:1.15;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-size:clamp(10px,1.55vw,18px); font-weight:800;
    letter-spacing:.18em; color:#25303f; text-transform:uppercase;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    transition:color .6s linear;
  }
  #hud .right{display:flex; gap:14px; align-items:center;}
  #hud .left{display:flex; flex-direction:column; gap:1px;}
  #hud .impl{font-size:.55em; letter-spacing:.2em; opacity:.5; margin-top:2px;}
  #hud .impl.on{opacity:.95; color:#b1600a;}
  body.night #hud .impl.on{color:var(--orange-lt);}
  #hud .lbl{font-size:.62em; opacity:.62; letter-spacing:.22em;}
  body.night #hud{color:#dfe6f2; text-shadow:0 1px 0 rgba(0,0,0,.6);}

  #overlay{
    position:fixed; inset:0; z-index:60; display:grid; place-items:center;
    background:rgba(9,11,17,.72);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .18s ease;
    padding:16px; line-height:1.45;
    overflow-y:auto; overscroll-behavior:contain;
  }
  #overlay.show{opacity:1; pointer-events:auto;}
  body.dimmed #hud{opacity:0;}
  #toast{
    position:absolute; left:50%; bottom:9px; transform:translate(-50%,6px);
    background:rgba(11,14,20,.86); border:1px solid #3b4556; color:#d4dcea;
    font-size:9.5px; letter-spacing:.14em; padding:6px 13px; border-radius:20px;
    opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
    text-transform:uppercase; white-space:nowrap; max-width:94%;
    overflow:hidden; text-overflow:ellipsis; line-height:1.2;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
  body.pwr #toast{bottom:52px;}
  #hud{transition:opacity .18s ease, color .6s linear;}

  /* ---------- slot do poder (martelo) ---------- */
  #powerSlot{
    position:absolute; right:10px; bottom:8px; z-index:5; display:none;
    font-family:inherit; cursor:pointer; text-align:right;
    background:rgba(11,14,20,.84); border:1px solid #3b4556; border-radius:7px;
    padding:5px 9px 6px; color:#cfd7e4; line-height:1.25;
    box-shadow:0 3px 0 #0b0e14, 0 8px 18px -12px #000;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #powerSlot .pwr-lbl{display:block; font-size:8px; letter-spacing:.22em; text-transform:uppercase; color:#7b8699;}
  #powerSlot .pwr-lbl kbd{padding:0 3px; font-size:8px; border-bottom-width:1px;}
  #powerSlot .pwr-state{display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#8d99ac;}
  #powerSlot .pwr-bar{display:block; height:4px; width:74px; margin-top:3px; border-radius:2px; background:#252c38; overflow:hidden;}
  #powerSlot .pwr-bar i{display:block; height:100%; width:100%; background:#3d4657; transition:width .12s linear;}
  #powerSlot.ready{border-color:#6f8a4a;}
  #powerSlot.ready .pwr-state{color:#c8ea9e;}
  #powerSlot.ready .pwr-bar i{background:linear-gradient(90deg,#8fd08a,#c8ea9e);}
  #powerSlot.active{border-color:var(--orange); box-shadow:0 3px 0 #0b0e14, 0 0 0 1px rgba(240,130,30,.5), 0 0 22px -8px var(--orange);}
  #powerSlot.active .pwr-state{color:var(--orange-lt);}
  #powerSlot.active .pwr-bar i{background:linear-gradient(90deg,#f0821e,#ffd23c);}
  #powerSlot.cool .pwr-state{color:#93a0b3;}
  #powerSlot:hover{border-color:var(--orange);}
  .panel{
    position:relative;
    background:linear-gradient(180deg,#1b2029,#141821);
    border:1px solid #333c4d;
    border-radius:8px;
    padding:18px 22px 16px;
    max-width:min(560px,100%);
    text-align:center;
    box-shadow:0 18px 40px -18px #000, 0 0 0 1px #000 inset;
    max-height:calc(100vh - 32px); overflow-y:auto; overscroll-behavior:contain;
  }
  .panel::before{
    content:""; position:absolute; left:0; right:0; top:0; height:5px;
    background:repeating-linear-gradient(45deg, var(--orange) 0 9px, #171b23 9px 18px);
    border-radius:7px 7px 0 0; opacity:.95;
  }
  .panel .tag{font-size:9.5px; letter-spacing:.28em; color:#8b97ab; text-transform:uppercase; margin-top:6px;}
  .panel h1{
    font-size:clamp(19px,4.1vw,32px); margin:8px 0 6px; letter-spacing:.1em;
    color:#fff; text-transform:uppercase; font-weight:900;
    text-shadow:0 2px 0 #7a3d05, 0 0 18px rgba(240,130,30,.45);
  }
  .panel h2{
    font-size:clamp(17px,3.4vw,26px); margin:10px 0 4px; letter-spacing:.12em;
    color:var(--orange); text-transform:uppercase; font-weight:900;
    text-shadow:0 2px 0 #4a2400;
  }
  .panel .sub{font-size:clamp(10px,1.4vw,12.5px); color:#a9b4c6; margin:8px 0 14px; line-height:1.6;}
  .panel p{margin:6px 0;}
  .panel .hint{font-size:10px; color:#7b8699; letter-spacing:.1em; margin-top:12px; text-transform:uppercase;}
  .panel .hint b{color:var(--orange-lt);}
  .record{color:#ffd23c; font-size:12px; letter-spacing:.2em; margin:6px 0 2px; animation:none;}
  .scores{display:flex; justify-content:center; gap:26px; margin:12px 0 16px;}
  .scores div{display:flex; flex-direction:column; gap:3px;}
  .scores span{font-size:9px; letter-spacing:.22em; color:#7b8699;}
  .scores b{font-size:clamp(16px,2.6vw,22px); color:#fff; letter-spacing:.1em;}
  .btn{
    font-family:inherit; font-weight:900; letter-spacing:.14em; text-transform:uppercase;
    background:var(--orange); color:#171101; border:none; border-radius:5px;
    padding:10px 20px; font-size:12px; cursor:pointer;
    box-shadow:0 3px 0 #8e4a08, 0 8px 18px -8px #f0821e;
    transition:transform .06s ease, filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #8e4a08;}
  .btn.big{padding:12px 26px; font-size:13px;}
  .btn.small{padding:7px 10px; font-size:9.5px; letter-spacing:.1em; border-radius:4px;}
  .btn.ghost{background:transparent; color:#c3cddc; box-shadow:0 0 0 1px #3a4455 inset; }
  .btn.ghost:hover{background:#222a36; color:#fff; filter:none;}
  .btn.eq{background:#2b3d2b; color:#b9e8a8; box-shadow:0 0 0 1px #4d7a3c inset;}
  .btn[disabled]{background:#2a313d; color:#6b7688; box-shadow:none; cursor:not-allowed;}
  .row-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; align-items:stretch;}
  .row-btns.center{align-items:center;}

  /* ---------- ícone da loja ---------- */
  .shop-tile{
    --tile:64px;
    display:inline-grid; place-items:center; padding:6px; line-height:0; cursor:pointer;
    background:transparent;
    border:1px solid #78849a; border-radius:9px;
    box-shadow:0 3px 0 #0b0e14, 0 10px 22px -14px #000;
    transition:transform .08s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .shop-tile img{display:block; height:var(--tile); width:auto;
    image-rendering:auto; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));}
  .shop-tile:hover{border-color:var(--orange); transform:translateY(-1px);
    box-shadow:0 4px 0 #0b0e14, 0 0 0 1px rgba(240,130,30,.35), 0 12px 26px -14px var(--orange);}
  .shop-tile:active{transform:translateY(2px); box-shadow:0 1px 0 #0b0e14;}

  /* botão principal: portão de início com brilho pulsante */
  .tile-main{
    border-color:#5a4a2e;
    animation:tilePulse 2.8s ease-in-out infinite;
  }
  .tile-main img{filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));}
  .tile-main:hover{animation:none; border-color:var(--orange); transform:translateY(-1px);
    box-shadow:0 4px 0 #0b0e14, 0 0 0 2px rgba(240,130,30,.5), 0 16px 34px -14px var(--orange);}
  @keyframes tilePulse{
    0%,100%{box-shadow:0 4px 0 #0b0e14, 0 0 0 1px rgba(240,130,30,.22), 0 12px 26px -18px #f0821e;}
    50%    {box-shadow:0 4px 0 #0b0e14, 0 0 0 2px rgba(240,130,30,.55), 0 18px 38px -12px #f0821e;}
  }

  .shop-brand{display:flex; align-items:center; gap:11px;}
  .shop-brand .shop-big{height:60px; width:auto; display:block;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.55));}
  .shop-brand .tag{margin:0; font-size:10px; letter-spacing:.24em; color:#9aa6b8; line-height:1.5; white-space:nowrap;}

  /* ---------- LOJA ---------- */
  .panel.shop{max-width:min(760px,96vw); text-align:left; padding:16px 18px 16px;}
  .shop-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-top:4px;}
  .shop-head h2{margin:2px 0 0; font-size:clamp(16px,2.6vw,22px);}
  .wallet{display:flex; flex-direction:column; align-items:flex-end; gap:2px;
    background:#11151c; border:1px solid #2e3745; border-radius:5px; padding:5px 10px; min-width:82px;}
  .wallet span{font-size:8px; letter-spacing:.22em; color:#7b8699;}
  .wallet b{font-size:14px; color:#ffd23c; letter-spacing:.06em;}
  .sub.small{font-size:9.5px; margin:6px 0 10px; line-height:1.5; color:#8d99ac;}
  .shop-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:9px; margin-bottom:14px;}
  .card{position:relative; background:#151a22; border:1px solid #2c3543; border-radius:6px;
    padding:9px 9px 10px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center;}
  .card.owned{border-color:#2f4358;}
  .card.equipped{border-color:var(--orange); box-shadow:0 0 0 1px var(--orange) inset, 0 0 22px -10px var(--orange);}
  .card .ribbon{position:absolute; top:-1px; right:-1px; background:var(--orange); color:#171101;
    font-size:7.5px; font-weight:900; letter-spacing:.14em; padding:2px 6px; border-radius:0 5px 0 5px;}
  .icowrap{height:82px; display:grid; place-items:center; width:100%; padding:3px;
    background:radial-gradient(circle at 50% 50%, #eef2f8 0%, #c2ccd9 85%); border-radius:4px;
    border:1px solid #94a1b3; box-shadow:0 0 0 1px rgba(0,0,0,.35) inset;}
  .card .ico{background-position:center;}
  .card .soon-ico{width:116px; height:66px; display:grid; place-items:center; font-size:34px;
    color:#8a95a8; font-weight:900; border:2px dashed #a9b4c4; border-radius:4px;}
  .card.soon{opacity:.5;}
  .card .power{font-size:7.5px; letter-spacing:.2em; color:var(--orange-lt); text-transform:uppercase;}
  .card.soon .power{color:#5b667a;}
  .card h3{margin:0; font-size:10px; letter-spacing:.08em; color:#fff; text-transform:uppercase; line-height:1.25;}
  .card p{font-size:9px; line-height:1.45; color:#93a0b3; margin:0;}
  .card .price{font-size:8.5px; letter-spacing:.16em; color:#ffd23c; margin-top:auto; padding-top:2px;}
  .card .price .owned-tag{color:#8fd08a;}
  .card .btn.small{width:100%;}
  .row-btns.tight{gap:5px; margin-top:2px; width:100%;}
  .row-btns.tight .btn.small{flex:1 1 0; min-width:0; padding:7px 4px; font-size:8.5px;}
  .btn.up{background:#2b3a52; color:#cfe0f8; box-shadow:0 3px 0 #16202e, 0 0 0 1px #3f5d84 inset;}
  .btn.up:hover{filter:brightness(1.15);}
  .btn.up[disabled]{background:#242b36; color:#69748a; box-shadow:none;}
  .lvrow{display:flex; align-items:center; gap:6px; justify-content:center; width:100%; margin:1px 0 0;}
  .pips{display:flex; gap:2px;}
  .pips i{width:5px; height:8px; border-radius:1px; background:#2c3543; box-shadow:0 0 0 1px #1b212b inset;}
  .pips i.on{background:linear-gradient(180deg,#ffd23c,#f0821e); box-shadow:0 0 0 1px #7a4a08 inset;}
  .lvnum{font-size:7.5px; letter-spacing:.14em; color:#8d99ac;}

  .loadout{display:flex; gap:18px; justify-content:center; margin:0 0 14px; flex-wrap:wrap;
    background:#11151c; border:1px solid #2a3341; border-radius:5px; padding:7px 12px;}
  .lo-item{display:flex; flex-direction:column; gap:1px;}
  .lo-item .lbl{font-size:8px; letter-spacing:.22em; color:#7b8699; text-transform:uppercase;}
  .lo-item b{font-size:11px; color:#e9edf4; letter-spacing:.06em; text-transform:uppercase;}
  .scores b.coin{color:#ffd23c;}

  footer{
    width:auto; max-width:1440px; margin-top:12px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    font-size:10.5px; letter-spacing:.1em; color:#6f7a8d; text-transform:uppercase;
  }
  footer .keys{display:flex; gap:8px; flex-wrap:wrap;}
  kbd{
    background:#20262f; color:#cfd7e4; border:1px solid #313a49; border-bottom-width:2px;
    border-radius:4px; padding:2px 6px; font-size:9.5px; font-family:inherit; letter-spacing:.1em;
  }
  #muteBtn{
    font-family:inherit; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    background:#1c222c; color:#cfd7e4; border:1px solid #313a49; border-radius:4px;
    padding:6px 10px; cursor:pointer;
  }
  #muteBtn.off{color:#6f7a8d; border-color:#262e3a;}
  @media (max-width:640px){
    body{padding:10px 8px 16px;}
    header{flex-direction:column; align-items:flex-start; gap:2px; padding-bottom:6px;}
    header h1{font-size:12px; letter-spacing:.1em;}
    header .meta{display:none;}
    .logo{width:20px; height:20px; font-size:11px;}
    footer{justify-content:center; text-align:center; margin-top:8px;}
    footer .keys span{display:none;}
    footer .keys span.touch{display:block;}
    .panel{padding:14px 16px 12px;}
    .panel.shop{padding:12px 12px 12px;}
    .shop-grid{grid-template-columns:repeat(2,1fr); gap:7px;}
    .icowrap{height:74px;}
    .card p{font-size:8px;}
    .pips i{width:4px; height:7px;}
    .lvnum{font-size:7px;}
    #powerSlot{padding:3px 6px 4px; bottom:6px; right:6px; opacity:.94;}
    #powerSlot .pwr-lbl{font-size:7px;}
    #powerSlot .pwr-bar{width:46px; height:3px;}
    #powerSlot .pwr-state{font-size:8px; letter-spacing:.08em;}
    .loadout{gap:12px; padding:6px 8px;}
    .shop-tile{padding:4px;}
    .shop-tile img{height:calc(var(--tile) * 0.8);}
    .shop-brand .shop-big{height:44px;}
    #hud{font-size:12px;}
  }
  @media (min-width:641px){ footer .keys span.touch{display:none;} }
</style>
</head>
<body>
<div class="hazard" style="max-width:1440px"></div>

<header>
  <div class="brand">
    <div class="logo">A</div>
    <h1>Arafer na Obra &middot; Desvio de Entulho</h1>
  </div>
  <div class="meta">obra <b>nº 01</b> &middot; setor de entulho</div>
</header>

<div id="stage">
  <canvas id="game" width="480" height="180"></canvas>
  <div id="hud">
    <div class="left">
      <div><span class="lbl">pts</span> <span id="score">00000</span></div>
      <div class="impl"><span class="lbl">impl</span> <span id="implName">SEM IMPLEMENTO</span></div>
    </div>
    <div class="right"><span class="lbl">rec</span> <span id="hi">00000</span></div>
  </div>
  <button id="powerSlot" type="button" title="Martelo hidráulico (F)" aria-label="Usar martelo hidráulico">
    <span class="pwr-lbl">martelo <kbd>f</kbd></span>
    <b class="pwr-state">PRONTO</b>
    <span class="pwr-bar"><i></i></span>
  </button>
  <div id="toast"></div>
</div>

<div id="overlay"></div>

<footer>
  <div class="keys">
    <span><kbd>espaço</kbd> <kbd>&uarr;</kbd> pular</span>
    <span><kbd>p</kbd> pausa</span>
    <span><kbd>r</kbd> reiniciar</span>
    <span><kbd>f</kbd> martelo</span>
    <span><kbd>m</kbd> som</span>
    <span class="touch"><kbd>toque</kbd> para pular</span>
  </div>
  <button id="muteBtn">SOM</button>
</footer>

<div class="hazard" style="margin-top:18px; max-width:1440px"></div>

<script>
// ---------------- helpers ----------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
let activeRng = Math.random;
const rand = (a, b) => a + activeRng() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function parseColor(c) {
  if (c[0] === '#') return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const m = c.replace(/[^0-9,.]/g, '').split(',');
  return [parseInt(m[0], 10), parseInt(m[1], 10), parseInt(m[2], 10)];
}
function lerpColor(a, b, t) {
  const A = parseColor(a), B = parseColor(b);
  return 'rgb(' + Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t)) + ')';
}

// ---------------- canvas ----------------
const W = 480, H = 180;
const GROUND_Y = 150;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const stage = document.getElementById('stage');
  const avail = Math.max(280, Math.min(1440, window.innerWidth - 24));
  let s = Math.floor((avail / W) * 4) / 4;   // passos de 0.25 = pixels quase perfeitos
  s = Math.max(0.4, Math.min(3, s));
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
  stage.style.width = (W * s) + 'px';
}
window.addEventListener('resize', fitCanvas);

// ---------------- sprites ----------------
const sheet = new Image();
sheet.src = SPRITE_SHEET;
let sheetReady = false;
sheet.onload = () => { sheetReady = true; };

function drawSprite(name, x, y, flip) {
  const r = SPRITE_MAP[name];
  if (!r || !sheetReady) return;
  x = Math.round(x); y = Math.round(y);
  if (flip) {
    ctx.save();
    ctx.translate(x + r[2], 0);
    ctx.scale(-1, 1);
    ctx.drawImage(sheet, r[0], r[1], r[2], r[3], 0, y, r[2], r[3]);
    ctx.restore();
  } else {
    ctx.drawImage(sheet, r[0], r[1], r[2], r[3], x, y, r[2], r[3]);
  }
}

// círculo "pixelado" (sem anti-aliasing)
function pxCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let dy = -r; dy <= r; dy++) {
    const half = Math.floor(Math.sqrt(r * r - dy * dy));
    ctx.fillRect(cx - half, cy + dy, half * 2 + 1, 1);
  }
}

function pxEllipse(cx, cy, rx, ry, color) {
  ctx.fillStyle = color;
  for (let dy = -ry; dy <= ry; dy++) {
    const half = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    ctx.fillRect(cx - half, cy + dy, half * 2 + 1, 1);
  }
}

// ---------------- fonte bitmap 3x5 (só dígitos e +) ----------------
const FONT3 = {
  '0': ['111', '101', '101', '101', '111'], '1': ['010', '110', '010', '010', '111'],
  '2': ['111', '001', '111', '100', '111'], '3': ['111', '001', '111', '001', '111'],
  '4': ['101', '101', '111', '001', '001'], '5': ['111', '100', '111', '001', '111'],
  '6': ['111', '100', '111', '101', '111'], '7': ['111', '001', '010', '010', '010'],
  '8': ['111', '101', '111', '101', '111'], '9': ['111', '101', '111', '001', '111'],
  '+': ['000', '010', '111', '010', '000'], ' ': ['000', '000', '000', '000', '000'],
  'X': ['101', '101', '010', '101', '101'], '!': ['010', '010', '010', '000', '010']
};
function text3(str, x, y, color) {
  ctx.fillStyle = color;
  let cx = x;

let actx = null, muted = false;
try { muted = localStorage.getItem('bobcat_mute') === '1'; } catch (e) { }
function AC() {
  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function blip(freq, freq2, dur, type, vol) {
  if (muted) return;
  try { _blip(freq, freq2, dur, type, vol); } catch (e) { muted = true; }
}
function _blip(freq, freq2, dur, type, vol) {
  const a = AC(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (freq2) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq2), a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, a.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noiseBurst(dur, vol) {
  if (muted) return;
  try { _noise(dur, vol); } catch (e) { muted = true; }
}
function _noise(dur, vol) {
  const a = AC(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100;
  const g = a.createGain(); g.gain.value = vol || 0.14;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}

function spawnWave() {
  const s = score;
  const pool = [['cone', 3], ['dirt_s', 3], ['dirt_m', 3], ['barrier', 2], ['sand', 2]];
  if (s > 120) { pool.push(['dumpster', 3]); pool.push(['tires', 2]); }
  if (s > 260) { pool.push(['dirt_l', 3]); pool.push(['cone', 2]); }
  if (s > 420) { pool.push(['pigeon', 2]); }
  let total = pool.reduce((a, p) => a + p[1], 0);
  let pick = Math.random() * total, type = pool[0][0];
  for (const p of pool) { pick -= p[1]; if (pick <= 0) { type = p[0]; break; } }

  const x = W + 10;
  const combo = Math.random();
  // espaçamento em "segundos de viagem", encolhe com o tempo
  const minT = Math.max(0.64, 1.08 - dist / 42000);
  if (type === 'cone' && combo < 0.45 && s > 90) {
    const n = randi(2, 3);
    for (let i = 0; i < n; i++) spawnObstacle('cone', x + i * 15);
  } else if (type === 'dirt_s' && combo < 0.4 && s > 150) {
    spawnObstacle('dirt_s', x);
    spawnObstacle('dirt_s', x + 26);
  } else if (type === 'pigeon') {
    spawnObstacle('pigeon', x, Math.random() < 0.62);
    spawnGap = speed * (minT + 0.9 + Math.random() * 0.5);   // dá tempo de pousar
    return;
  } else {
    spawnObstacle(type, x);
  }

  spawnGap = speed * (minT + Math.random() * 0.8);
}

  state = 'ready';
  score = 0; dist = 0; speed = BASESPEED; scroll = 0;
  obstacles = []; helmets = []; parts = []; pops = [];
  bob.y = GROUND_Y - 36; bob.vy = 0; bob.grounded = true; bob.dead = false;
  bob.coyote = 0; bob.buffer = 0;
  bucketLoad = 0; resetPower();
  shake = 0; flash = 0; nightTarget = 0; night = 0;
  blip(520, 330, 0.1, 'square', 0.04);
  showStart();
  renderHUD();
}

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('bobcat_mute', muted ? '1' : '0'); } catch (e) { }
  updateMuteBtn();
}
function updateMuteBtn() {
  elMute.textContent = muted ? '\uD83D\uDD07 SOM' : '\uD83D\uDD0A SOM';
  elMute.classList.toggle('off', muted);
}

// ---------------- update ----------------
function update(dt) {
  if (window.mp && window.mp.enabled) window.mp.tick(dt);
  time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (flash > 0) flash = Math.max(0, flash - dt * 4.5);
  if (bucketLoad > 0) bucketLoad = Math.max(0, bucketLoad - dt);
  if (powerCd > 0) powerCd = Math.max(0, powerCd - dt);

  for (const c of clouds) { c.x -= c.v * dt * (state === 'run' ? 1 : 0.55); if (c.x < -80) c.x = 520 + Math.random() * 90; }

  // transição dia/noite
  nightTarget = (Math.floor(score / 700) % 2 === 1) ? 1 : 0;
  night += (nightTarget - night) * Math.min(1, dt * 1.6);
  const isNight = night > 0.45;
  if (isNight !== lastNightClass) { lastNightClass = isNight; document.body.classList.toggle('night', isNight); }

  // partículas
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].life -= dt; pops[i].y -= 16 * dt;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }

  if (state !== 'run') {
    if (state === 'over') { /* dust settle */ }
    return;
  }

  // velocidade / pontuação
  speed = Math.min(MAXSPEED, BASESPEED + dist * 0.0125);
  scroll += speed * dt;
  dist += speed * dt;
  const prev = score;
  score += speed * dt * 0.11;
  if (Math.floor(score / 100) > Math.floor(prev / 100)) { SFX.point(); }

  // jogador
  bob.buffer = Math.max(0, bob.buffer - dt);
  bob.coyote = Math.max(0, bob.coyote - dt);
  if (bob.buffer > 0 && (bob.grounded || bob.coyote > 0)) {
    bob.vy = JUMP_V; bob.grounded = false; bob.coyote = 0; bob.buffer = 0;
    SFX.jump();
    puff(bob.x + 14, GROUND_Y - 2, 6, [DAY.ground, DAY.groundEdge], 30, 40);
  }
  if (!bob.grounded) {
    let g = GRAV;
    if (jumpHeld && bob.vy < 0) g *= 0.78;             // pulo variável
    if (!jumpHeld && bob.vy > 0) g *= 1.35;
    bob.vy += g * dt;
    bob.y += bob.vy * dt;
    if (bob.y >= GROUND_Y - 36) {
      bob.y = GROUND_Y - 36; bob.vy = 0;
      if (!bob.grounded) {
        bob.grounded = true;
        puff(bob.x + 16, GROUND_Y - 2, 8, [DAY.ground, DAY.groundEdge, DAY.pebble], 40, 55);
        SFX.land();
      }
    }
  } else {
    bob.coyote = 0.09;
    // poeira das rodas
    if (Math.random() < dt * 26) puff(bob.x + 8, GROUND_Y - 3, 1, [DAY.ground, DAY.pebble2], 22, 34);
  }

  // poder ativo do martelo + rotação (pra frente ao ativar, pra baixo ao acabar)
  const wasHammerActive = powerT > 0;
  if (powerT > 0) {
    powerT = Math.max(0, powerT - dt);
    hammerSweep();
    if (Math.random() < dt * 42) {
      const tipY = bob.y + (bob.grounded ? 17 : 10);
      const tipX = hammerTilt >= 0.8 ? bob.x + 77 + rand(-2, 4) : bob.x + 56 + hammerTilt * 18;
      puff(tipX, tipY + rand(-2, 2), 1, ['#ffd23c', '#fff0a8', '#aab4c4'], 34, 45);
    }
    if (powerT <= 0 && wasHammerActive) {
      SFX.hammerOff();
    }
  }
  const tiltTarget = (hasImpl() && equippedId === 'martelo' && powerT > 0) ? 1 : 0;
  if (hammerTilt < tiltTarget) {
    hammerTilt = Math.min(1, hammerTilt + dt * 9.5);
  } else if (hammerTilt > tiltTarget) {
    hammerTilt = Math.max(0, hammerTilt - dt * 7.5);
  }

  // obstáculos
  spawnGap -= speed * dt;
  if (spawnGap <= 0) spawnWave();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    o.anim += dt;
    if (o.x + o.w < -20) obstacles.splice(i, 1);
  }
  // coletáveis
  helmetTimer -= dt;
  if (helmetTimer <= 0) {
    const busy = obstacles.some(o => o.x + o.w > W - 70);
    if (busy) helmetTimer = 0.6;
    else { spawnHelmet(); helmetTimer = rand(4.5, 8); }
  }
  for (let i = helmets.length - 1; i >= 0; i--) {
    const h = helmets[i];
    h.x -= speed * dt; h.t += dt;
    if (h.x < -30) helmets.splice(i, 1);
  }

  // colisão
  const bx = bob.x + 7, by = bob.y + 4, bw = bob.w, bh = bob.h;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    const ox = o.x + o.hx, oy = o.y + o.hy, ow = o.hw, oh = o.hh;
    if (bx < ox + ow && bx + bw > ox && by < oy + oh && by + bh > oy) {
      // MARTELO ATIVO: quebra em vez de bater (areia não quebra)
      if (powerT > 0 && o.type !== 'sand') { breakObstacle(i, o); }
      // PODER DA PÁ: caindo em cima do obstáculo, recolhe em vez de bater
      else if (hasImpl() && equippedId === 'pa' && !bob.grounded && bob.vy > 0) { scoop(i, o); }
      else { gameOver(); return; }
    }
  }
  for (let i = helmets.length - 1; i >= 0; i--) {
    const h = helmets[i];
    if (bx < h.x + 16 && bx + bw > h.x && by < h.y + 12 && by + bh > h.y) {
      helmets.splice(i, 1);
      score += 25; SFX.pick();
      popText(h.x + 4, h.y - 4, '+25');
      puff(h.x + 8, h.y + 6, 8, ['#ffd23c', '#fff0a8', '#f0821e'], 34, 40);
    }
  }

  renderHUD();
}

function breakObstacle(i, o) {
  obstacles.splice(i, 1);
  score += 12;
  shake = Math.max(shake, 0.34);
  SFX.breakIt();
  popText(o.x + o.w / 2 - 6, o.y - 4, '+12');
  const col = o.fly ? ['#e8ecf0', '#aab4c4', '#6d7486'] : ['#8a6a48', '#b1935f', '#c9a878'];
  puff(o.x + o.w / 2, o.y + o.h / 2, 14, col, 70, 95);
  puff(o.x + o.w / 2, o.y + o.h / 2, 6, ['#ffd23c', '#fff0a8', '#f0821e'], 34, 55);
}

// durante o poder: quebra o que estiver à frente (areia não quebra)
function hammerSweep() {
  const zx = bob.x + 30, zy = bob.y - 6, zw = 51, zh = bob.h + 14;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (o.type === 'sand') continue;
    const ox = o.x + o.hx, oy = o.y + o.hy, ow = o.hw, oh = o.hh;
    if (zx < ox + ow && zx + zw > ox && zy < oy + oh && zy + zh > oy) breakObstacle(i, o);
  }
}

function scoop(i, o) {
  obstacles.splice(i, 1);
  const pts = scoopPoints();
  score += pts;
  bob.vy = -250; bob.grounded = false;   // repique ao recolher
  bucketLoad = 1.5;
  shake = Math.max(shake, 0.32);
  SFX.scoop();
  popText(o.x + o.w / 2 - 6, o.y - 4, '+' + pts);
  const col = o.fly ? ['#e8ecf0', '#aab4c4', '#6d7486'] : ['#8a6a48', '#b1935f', '#c9a878'];
  puff(o.x + o.w / 2, o.y + o.h / 2, 12, col, 55, 80);
}

// ---------------- desenho ----------------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, lerpColor(DAY.skyTop, NIGHT.skyTop, night));
  g.addColorStop(1, lerpColor(DAY.skyBot, NIGHT.skyBot, night));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y);

  // estrelas
  if (night > 0.02) {
    for (const s of stars) {
      const tw = 0.65 + 0.35 * Math.sin(time * 2.2 + s.p);
      ctx.fillStyle = 'rgba(255,255,255,' + (night * s.b * tw).toFixed(3) + ')';
      ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
    }
  }

  // sol / lua
  const sx = 402, sy = 34;
  const sunC = lerpColor(DAY.sun, NIGHT.sun, night);
  const coreC = lerpColor(DAY.sunCore, NIGHT.sunCore, night);
  pxCircle(sx, sy, 13, 'rgba(255,240,180,' + (0.14 * (1 - night)).toFixed(3) + ')');
  pxCircle(sx, sy, 11, sunC);
  pxCircle(sx - 2, sy - 2, 8, coreC);
  if (night > 0.5) {
    // crateras da lua
    ctx.fillStyle = 'rgba(180,192,215,' + ((night - 0.5) * 2 * 0.7).toFixed(3) + ')';
    ctx.fillRect(sx + 2, sy - 1, 3, 3);
    ctx.fillRect(sx - 6, sy + 3, 2, 2);
    ctx.fillRect(sx + 1, sy - 6, 2, 2);
  }
}

function drawFar() {
  const aC = lerpColor(DAY.farA, NIGHT.farA, night);
  const bC = lerpColor(DAY.farB, NIGHT.farB, night);
  const cC = lerpColor(DAY.farC, NIGHT.farC, night);
  const hazeC = lerpColor(DAY.skyBot, NIGHT.skyBot, night);

  // --- camada distante (esmaecida) ---
  const off2 = (scroll * 0.07) % BG2_W;
  ctx.fillStyle = lerpColor('#b9cadb', '#232d43', night);
  for (let pass = -1; pass <= 1; pass++) {
    for (const b of farBuildings) {
      let x = b.x - off2 + pass * BG2_W;
      if (x > W + 30 || x + b.w < -30) continue;
      x = Math.round(x);
      const top = GROUND_Y - b.h - 6;
      ctx.fillRect(x, top, b.w, b.h + 6);
    }
  }
  // névoa do horizonte
  ctx.fillStyle = hazeC;
  ctx.globalAlpha = 0.42;
  ctx.fillRect(0, GROUND_Y - 20, W, 20);
  ctx.globalAlpha = 1;

  // --- camada principal ---
  const off = (scroll * 0.18) % BG_W;
  const tones = [];
  for (let i = 0; i < 4; i++) tones.push(lerpColor(DAY.farB, DAY.farA, 0.12 + i * 0.26));
  const tonesN = [];
  for (let i = 0; i < 4; i++) tonesN.push(lerpColor(NIGHT.farB, NIGHT.farA, 0.12 + i * 0.26));
  for (let pass = -1; pass <= 1; pass++) {
    for (const b of buildings) {
      let x = b.x - off + pass * BG_W;
      if (x > W + 40 || x + b.w < -40) continue;
      x = Math.round(x);
      const top = GROUND_Y - b.h;
      const ti = Math.min(3, Math.floor(b.tone * 4));
      ctx.fillStyle = lerpColor(tones[ti], tonesN[ti], night);
      ctx.fillRect(x, top, b.w, b.h);
      ctx.fillStyle = aC;
      ctx.fillRect(x, top, b.w, 2);
      ctx.fillRect(x, top, 2, b.h);
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.fillRect(x + b.w - 2, top, 2, b.h);
      if (b.ant) {
        ctx.fillStyle = cC;
        ctx.fillRect(x + (b.w >> 1), top - 7, 1, 7);
        ctx.fillStyle = 'rgba(214,74,62,0.85)';
        ctx.fillRect(x + (b.w >> 1) - 1, top - 9, 3, 2);
      }
      for (const wn of b.wins) {
        ctx.fillStyle = 'rgba(255,214,120,' + (night * 0.9).toFixed(3) + ')';
        ctx.fillRect(x + wn[0], top + wn[1], 2, 3);
        ctx.fillStyle = 'rgba(126,146,174,' + (0.75 - night * 0.6).toFixed(3) + ')';
        ctx.fillRect(x + wn[0], top + wn[1], 2, 1);
      }
      if (b.crane) {
        const mx = x + 6;
        const mh = 40;
        ctx.fillStyle = cC;
        ctx.fillRect(mx, top - mh, 2, mh);            // torre
        ctx.fillRect(mx - 10, top - mh - 3, 34, 2);   // lança
        ctx.fillRect(mx - 10, top - mh - 6, 2, 6);    // contrapeso
        ctx.fillRect(mx + 20, top - mh - 1, 1, 10);   // cabo
        ctx.fillRect(mx + 19, top - mh + 9, 3, 3);    // gancho
        ctx.fillStyle = 'rgba(240,130,30,' + (0.85 - night * 0.35).toFixed(3) + ')';
        ctx.fillRect(mx, top - mh, 2, 3);
        // treliça
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        for (let k = 3; k < mh; k += 5) ctx.fillRect(mx, top - k, 2, 1);
      }
    }
  }
}

const tintCache = {};
function tintSprite(name, color) {
  const key = name + color;
  if (tintCache[key]) return tintCache[key];
  const r = SPRITE_MAP[name];
  const c = document.createElement('canvas');
  c.width = r[2]; c.height = r[3];
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(sheet, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = color;
  g.fillRect(0, 0, r[2], r[3]);
  tintCache[key] = c;
  return c;
}

function drawClouds() {
  const r = SPRITE_MAP.cloud;
  const col = lerpColor(DAY.cloud, NIGHT.cloud, night);
  const tinted = tintSprite('cloud', col);
  for (const cl of clouds) {
    ctx.save();
    ctx.translate(Math.round(cl.x), Math.round(cl.y));
    ctx.scale(cl.s, cl.s);
    ctx.drawImage(tinted, 0, 0, r[2], r[3], 0, 0, r[2], r[3]);
    ctx.restore();
  }
}

function drawGround() {
  const gc = lerpColor(DAY.ground, NIGHT.ground, night);
  const ec = lerpColor(DAY.groundEdge, NIGHT.groundEdge, night);
  const pc = lerpColor(DAY.pebble, NIGHT.pebble, night);
  const pc2 = lerpColor(DAY.pebble2, NIGHT.pebble2, night);

  ctx.fillStyle = gc;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // camadas de terra
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, GROUND_Y + 14, W, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, GROUND_Y + 19, W, 1);
  // faixa superior (terra batida)
  ctx.fillStyle = ec;
  ctx.fillRect(0, GROUND_Y, W, 3);
  ctx.fillStyle = pc2;
  ctx.fillRect(0, GROUND_Y + 3, W, 1);

  // pedrinhas rolando
  const off = scroll % 480;
  for (const p of pebbles) {
    let x = p.x - off;
    if (x < -4) x += 480;
    ctx.fillStyle = p.c === 'pebble' ? pc : pc2;
    ctx.fillRect(Math.round(x), p.y, p.w, p.h);
  }
  // marcas de esteira
  // manchas de terra
  ctx.fillStyle = 'rgba(0,0,0,0.045)';
  const sOff = (scroll * 1.0) % 96;
  for (let x = -96; x < W + 96; x += 96) {
    ctx.fillRect(Math.round(x - sOff), GROUND_Y + 5, 22, 3);
    ctx.fillRect(Math.round(x - sOff) + 40, GROUND_Y + 19, 34, 4);
    ctx.fillRect(Math.round(x - sOff) + 70, GROUND_Y + 11, 14, 2);
  }
  const tOff = (scroll * 1.0) % 64;
  ctx.fillStyle = 'rgba(0,0,0,0.075)';
  for (let x = -64; x < W + 64; x += 64) {
    ctx.fillRect(Math.round(x - tOff), GROUND_Y + 9, 24, 2);
    ctx.fillRect(Math.round(x - tOff + 12), GROUND_Y + 25, 24, 2);
  }
  // gradiente escurecendo para baixo
  const gg = ctx.createLinearGradient(0, GROUND_Y + 6, 0, H);
  gg.addColorStop(0, 'rgba(0,0,0,0)');
  gg.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, GROUND_Y + 6, W, H - GROUND_Y - 6);
}

function drawObstacles() {
  for (const o of obstacles) {
    if (o.fly) {
      const f = Math.floor(o.anim * 9) % 2 === 0 ? 'pigeon1' : 'pigeon2';
      drawSprite(f, o.x, o.y, true);
    } else {
      drawSprite(o.spr, o.x, o.y, false);
    }
  }
}

function drawHelmets() {
  for (const h of helmets) {
    const bobY = Math.sin(h.t * 4) * 2;
    ctx.globalAlpha = 0.9;
    drawSprite('helmet', h.x, h.y + bobY, false);
    ctx.globalAlpha = 1;
    // brilhinho
    ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.25 * Math.sin(h.t * 8)).toFixed(3) + ')';
    ctx.fillRect(Math.round(h.x) + 12, Math.round(h.y + bobY) + 2, 2, 2);
  }
}

function drawBobcat() {
  if (window.mp && window.mp.enabled) window.mp.drawOpponents();
  const air = !bob.grounded;
  // sombra no chão
  const alt = Math.max(0, (GROUND_Y - 36) - bob.y);
  const a = clamp(0.24 - alt * 0.0022, 0.04, 0.24);
  const rx = Math.max(9, 22 - alt * 0.16);
  pxEllipse(Math.round(bob.x + 30), GROUND_Y + 1, Math.round(rx), 3, 'rgba(0,0,0,' + a.toFixed(3) + ')');

  const pre = equippedId === 'pa' ? 'bob_pa_' : equippedId === 'martelo' ? 'bob_ma_' : 'bob_';
  const buzzing = powerT > 0 && state === 'run';
  const f = Math.floor(time * (buzzing ? 34 : (air ? 8 : 11))) % 2;
  const jx = buzzing ? Math.round(rand(-1.4, 1.4)) : 0;
  const jy = buzzing ? Math.round(rand(-1.2, 1.2)) : 0;
  if (state === 'over') { drawSprite(pre + 'a1', bob.x, bob.y, false); return; }
  const arm = air ? 'b' : 'a';
  let sprName = pre + arm + (f + 1);
  if (equippedId === 'martelo' && hammerTilt >= 0.2) {
    if (hammerTilt < 0.52) sprName = 'bob_ma_t1_' + arm;
    else if (hammerTilt < 0.82) sprName = 'bob_ma_t2_' + arm;
    else sprName = 'bob_ma_f_' + arm + (f + 1);
  }
  drawSprite(sprName, bob.x + jx, bob.y + jy, false);
  if (buzzing && hammerTilt >= 0.82) {
    // faíscas e impacto na ponta frontal do martelete
    const sx = Math.round(bob.x + jx + (f === 1 ? 79 : 76));
    const sy = Math.round(bob.y + jy + (air ? 10 : 17));
    ctx.fillStyle = Math.random() < 0.5 ? '#ffd23c' : '#fff6c8';
    ctx.fillRect(sx + Math.round(rand(0, 3)), sy + Math.round(rand(-3, 3)), 1, 1);
    ctx.fillRect(sx + Math.round(rand(-1, 2)), sy + Math.round(rand(-2, 2)), 1, 1);
    if (f === 1) {
      ctx.fillStyle = '#fff6c8';
      ctx.fillRect(sx + 2, sy - 2, 2, 1);
      ctx.fillRect(sx + 2, sy + 2, 2, 1);
    }
  }

  // entulho recolhido aparecendo na caçamba
  if (equippedId === 'pa' && bucketLoad > 0) {
    const byo = air ? 9 : 16;
    const fill = clamp(bucketLoad / 1.5, 0, 1);
    const hgt = Math.max(1, Math.round(6 * fill));
    const px = Math.round(bob.x) + 47, py = Math.round(bob.y) + byo + 4 + (6 - hgt);
    ctx.fillStyle = '#6c4a2c';
    ctx.fillRect(px, py, 11, hgt);
    ctx.fillStyle = '#8a6a48';
    ctx.fillRect(px, py, 11, 1);
    ctx.fillStyle = '#b1935f';
    ctx.fillRect(px + 1, py, 3, 1);
  }
}

function drawParticles() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for (const t of pops) {
    ctx.globalAlpha = clamp(t.life * 2, 0, 1);
    text3(t.txt, t.x, t.y - 6, '#ffe06a');
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate(Math.round((Math.random() - 0.5) * shake * 5), Math.round((Math.random() - 0.5) * shake * 4));
  }
  drawSky();
  drawFar();
  drawClouds();
  drawGround();
  drawHelmets();
  drawObstacles();
  drawParticles();
  drawBobcat();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,70,50,' + (flash * 0.35).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

// ---------------- loop ----------------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
}

// ---------------- telas (início / loja) ----------------
function powerLine(it) {
  if (!ownedImpl[it.id]) return it.power;
  if (it.id === 'martelo') return 'QUEBRA ' + powerDuration() + 'S &middot; RECARGA 45S';
  return 'RECOLHE +' + scoopPoints() + ' PTS';
}

function pipsHTML(it) {
  const L = levelOf(it.id), M = it.maxLevel;
  let pips = '';
  for (let i = 1; i <= M; i++) pips += '<i class="' + (i <= L ? 'on' : '') + '"></i>';
  return '<div class="lvrow"><span class="pips">' + pips + '</span>' +
    '<span class="lvnum">N&Iacute;VEL ' + L + '/' + M + '</span></div>';
}

function cardHTML(it) {
  const isOwned = !!ownedImpl[it.id];
  const isEq = equippedId === it.id;
  const maxed = isOwned && isMaxLevel(it.id);
  const cost = upgradeCost(it.id);
  let actions;

  if (!isOwned) {
    actions = coins >= it.price
      ? '<button class="btn small" data-act="buy" data-id="' + it.id + '">' + (it.price === 0 ? 'ADQUIRIR' : 'COMPRAR') + '</button>'
      : '<button class="btn small" disabled>FALTAM ' + (it.price - Math.floor(coins)) + '</button>';
  } else {
    actions = isEq
      ? '<button class="btn small eq" data-act="unequip" data-id="' + it.id + '" title="Clique para remover">EQUIPADO &#10003;</button>'
      : '<button class="btn small" data-act="equip" data-id="' + it.id + '">EQUIPAR</button>';
    if (maxed) actions += '<button class="btn small up" disabled>N&Iacute;VEL M&Aacute;X.</button>';
    else if (coins >= cost) actions += '<button class="btn small up" data-act="up" data-id="' + it.id + '">&#9650; ' + cost + ' OURO</button>';
    else actions += '<button class="btn small up" disabled>&#9650; ' + cost + ' OURO</button>';
  }

  return '<div class="card' + (isEq ? ' equipped' : '') + (isOwned ? ' owned' : '') + '">' +
    (isEq ? '<div class="ribbon">EM USO</div>' : '') +
    '<div class="icowrap"><div class="ico" data-ico="' + it.icon + '"></div></div>' +
    '<div class="power">' + powerLine(it) + '</div>' +
    '<h3>' + it.name + '</h3>' +
    '<p>' + it.desc + '</p>' +
    (isOwned ? pipsHTML(it) : '') +
    '<div class="price">' + (isOwned ? '<span class="owned-tag">NA GARAGEM</span>' : (it.price === 0 ? 'GR&Aacute;TIS' : it.price + ' OURO')) + '</div>' +
    '<div class="row-btns tight">' + actions + '</div>' +
    '</div>';
}

function soonHTML(name) {
  return '<div class="card soon">' +
    '<div class="icowrap"><div class="ico soon-ico">?</div></div>' +
    '<div class="power">BLOQUEADO</div>' +
    '<h3>' + name + '</h3>' +
    '<p>Implemento em desenvolvimento na oficina.</p>' +
    '<div class="price">&mdash;</div>' +
    '<button class="btn small" disabled>EM BREVE</button>' +
    '</div>';
}

function showShop() {
  const cards = IMPLEMENTS.map(cardHTML).join('') + soonHTML('Garra / Pinça');
  showOverlay(
    '<div class="panel shop">' +
    '<div class="shop-head">' +
    '<div class="shop-brand">' +
    '<img class="shop-big" src="' + SHOP_ICON + '" alt="Loja de implementos">' +
    '<div class="tag">GALPÃO DE IMPLEMENTOS</div>' +
    '</div>' +
    '<div class="wallet"><span>OURO</span><b>' + Math.floor(coins) + '</b></div>' +
    '</div>' +
    '<p class="sub small">O implemento fica acoplado na Bobcat e muda o poder dela durante a rodada. Use o ouro para melhorar cada implemento.</p>' +
    '<div class="shop-grid">' + cards + '</div>' +
    '<div class="row-btns">' +
    '<button id="btnBack" class="btn ghost">VOLTAR</button>' +
    startTileHTML('btnPlayShop', 48) +
    '</div>' +
    '</div>'
  );
  uiLock = true;
  applyIcons(elOverlay);
  document.getElementById('btnBack').onclick = () => showStart();
  document.getElementById('btnPlayShop').onclick = () => startGame();
  elOverlay.onclick = (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.dataset.id, act = b.dataset.act, it = implById(id);
    if (!it) return;
    if (act === 'buy' && !ownedImpl[id] && coins >= it.price) {
      coins -= it.price; ownedImpl[id] = true; equippedId = id;
      SFX.pick(); saveProgress(); showShop(); renderHUD();
    } else if (act === 'equip') {
      equippedId = id; SFX.pick(); saveProgress(); showShop(); renderHUD();
    } else if (act === 'unequip') {
      equippedId = null; blip(420, 240, 0.09, 'square', 0.04); saveProgress(); showShop(); renderHUD();
    } else if (act === 'up' && ownedImpl[id] && !isMaxLevel(id)) {
      const cost = upgradeCost(id);
      if (coins >= cost) {
        coins -= cost; levels[id] = levelOf(id) + 1;
        SFX.pick(); saveProgress(); showShop(); renderHUD();
        toast(it.name + ' agora no nível ' + levels[id] +
          (id === 'martelo' ? ' · quebra por ' + powerDuration() + 's' : ' · +' + scoopPoints() + ' pts'), 3200);
      } else {
        blip(300, 180, 0.12, 'square', 0.05);
        toast('ouro insuficiente · faltam ' + Math.ceil(cost - coins), 2000);
      }
    }
  };
}

function showStart() {
  const eq = hasImpl() ? implById(equippedId) : null;
  showOverlay(
    '<div class="panel start">' +
    '<div class="tag">OBRA N&ordm; 01 &middot; DESVIO DE ENTULHO</div>' +
    '<h1>ARAFER NA OBRA</h1>' +
    '<p class="sub">Ajude a Bobcat a atravessar a obra sem bater nos montes de terra,<br>caçambas, cones e pombos distra&iacute;dos.</p>' +
    '<div class="loadout">' +
    '<div class="lo-item"><span class="lbl">implemento</span><b>' + (eq ? eq.name + ' nv' + levelOf(eq.id) : 'nenhum (s&oacute; o bra&ccedil;o)') + '</b></div>' +
    '<div class="lo-item"><span class="lbl">ouro</span><b>' + Math.floor(coins) + '</b></div>' +
    '</div>' +
    '<div class="row-btns center">' +
    shopTileHTML('btnShop', 92) +
    startTileHTML('btnStart', 92) +
    '</div>' +
    '<div class="row-btns center" style="margin-top:8px;">' +
    '<button id="btnMultiplayer" class="btn mp-entry-btn">&#127937; MULTIPLAYER (AT&Eacute; 4)</button>' +
    '</div>' +
    '<p class="hint"><b>ESPA&Ccedil;O</b> / <b>&uarr;</b> / toque = pular &nbsp;&middot;&nbsp; segure para pular mais alto' +
    (equippedId === 'martelo' ? '<br><b>F</b> / bot&atilde;o do canto = martelo hidr&aacute;ulico (' + powerDuration() + 's &middot; recarga 45s)' : '') + '</p>' +
    '</div>'
  );
  document.getElementById('btnStart').onclick = () => { if (window.mp) window.mp.enabled = false; startGame(); };
  document.getElementById('btnShop').onclick = () => showShop();
  document.getElementById('btnMultiplayer').onclick = () => window.mp.openMenu();
  renderHUD();
}

// ---------------- boot ----------------
function boot() {
  fitCanvas();
  updateMuteBtn();
  renderHUD();
  elMute.onclick = (e) => { e.stopPropagation(); toggleMute(); };
  if (elPower) elPower.onclick = (e) => { e.stopPropagation(); usePower(); };
  showStart();
  requestAnimationFrame(frame);
}

if (document.readyState === 'complete' || document.readyState === 'interactive') boot();
else window.addEventListener('DOMContentLoaded', boot);

<script>
(function () {
  const stage = document.getElementById('stage');
  const mpHud = document.createElement('div');
  mpHud.id = 'mp-hud';
  stage.appendChild(mpHud);

  const mp = {
    enabled: false,
    ws: null,
    selfId: null,
    roomCode: null,
    status: 'idle', // idle | lobby | playing | finished
    players: [],
    opponents: new Map(), // id -> { name, color, distance, y, duck, impl, alive }
    sendAccum: 0,
    errorMsg: '',

    getPlayerName() {
      try { return localStorage.getItem('bobcat_mp_name') || 'Operador'; } catch { return 'Operador'; }
    },
    setPlayerName(name) {
      try { localStorage.setItem('bobcat_mp_name', name); } catch {}
    },

    connect(onOpen) {
      if (this.ws && this.ws.readyState === 1) {
        if (onOpen) onOpen();
        return;
      }
      if (this.ws && this.ws.readyState === 0) {
        this.ws.addEventListener('open', onOpen, { once: true });
        return;
      }
      const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
      this.ws = new WebSocket(proto + location.host);
      this.ws.onopen = () => { if (onOpen) onOpen(); };
      this.ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        this.handleMessage(msg);
      };
      this.ws.onclose = () => {
        if (this.enabled && this.status !== 'idle') {
          this.errorMsg = 'Conexão perdida com o servidor.';
          if (this.status === 'lobby') this.showLobby();
        }
      };
    },

    send(obj) {
      if (this.ws && this.ws.readyState === 1) {
        this.ws.send(JSON.stringify(obj));
      }
    },

    handleMessage(msg) {
      if (msg.type === 'welcome') {
        this.selfId = msg.id;
      } else if (msg.type === 'error') {
        this.errorMsg = msg.message || 'Erro';
        if (this.status === 'lobby') this.showLobby();
        else this.openMenu();
      } else if (msg.type === 'room_joined') {
        this.enabled = true;
        this.roomCode = msg.code;
        this.selfId = msg.selfId;
        this.players = msg.players || [];
        this.status = 'lobby';
        this.errorMsg = '';
        this.showLobby();
      } else if (msg.type === 'room_update') {
        this.players = msg.players || [];
        if (msg.backToLobby) this.status = 'lobby';
        if (this.status === 'lobby') this.showLobby();
      } else if (msg.type === 'game_start') {
        this.status = 'playing';
        this.players = msg.players || [];
        this.opponents.clear();
        for (const p of this.players) {
          if (p.id !== this.selfId) {
            this.opponents.set(p.id, {
              name: p.name,
              color: p.color,
              distance: 0,
              y: GROUND_Y - 36,
              duck: false,
              impl: p.impl || null,
              alive: true
            });
          }
        }
        mpHud.classList.add('show');
        this.renderHud();
        startGame(msg.seed);
      } else if (msg.type === 'player_state') {
        const opp = this.opponents.get(msg.id);
        if (opp) {
          opp.distance = msg.distance;
          opp.y = msg.y;
          opp.duck = msg.duck;
          opp.impl = msg.impl;
          opp.alive = msg.alive;
        }
      } else if (msg.type === 'player_died') {
        const opp = this.opponents.get(msg.id);
        if (opp) {
          opp.alive = false;
          opp.distance = msg.distance;
        }
        this.renderHud();
      } else if (msg.type === 'race_over') {
        this.status = 'finished';
        mpHud.classList.remove('show');
        this.showRaceOver(msg.ranking || []);
      }
    },

    openMenu() {
      this.enabled = false;
      this.status = 'idle';
      mpHud.classList.remove('show');
      const savedName = this.getPlayerName();
      showOverlay(
        '<div class="panel mp-panel">' +
        '<div class="tag">MODO MULTIPLAYER &middot; AT&Eacute; 4 JOGADORES</div>' +
        '<h2>CORRIDA NA OBRA</h2>' +
        '<p class="sub small">Todos correm no mesmo mapa ao mesmo tempo. Ganha quem chegar mais longe!</p>' +
        '<div class="mp-field">' +
        '<label>Seu Nome</label>' +
        '<input id="mpName" class="mp-input" maxlength="16" value="' + savedName.replace(/"/g, '&quot;') + '">' +
        '</div>' +
        '<div class="mp-error">' + (this.errorMsg || '') + '</div>' +
        '<div class="row-btns center" style="margin-bottom:12px;">' +
        '<button id="mpCreate" class="btn">CRIAR SALA (HOST)</button>' +
        '</div>' +
        '<div class="mp-field">' +
        '<label>Ou entrar com c&oacute;digo da sala</label>' +
        '<div class="mp-join-row">' +
        '<input id="mpCode" class="mp-input" maxlength="6" placeholder="EX: A1B2C">' +
        '<button id="mpJoin" class="btn">ENTRAR</button>' +
        '</div>' +
        '</div>' +
        '<div class="row-btns center" style="margin-top:12px;">' +
        '<button id="mpBack" class="btn ghost">VOLTAR</button>' +
        '</div>' +
        '</div>'
      );
      this.errorMsg = '';
      document.getElementById('mpBack').onclick = () => showStart();
      document.getElementById('mpCreate').onclick = () => {
        const name = (document.getElementById('mpName').value || 'Operador').trim();
        this.setPlayerName(name);
        this.connect(() => this.send({ type: 'create_room', name }));
      };
      document.getElementById('mpJoin').onclick = () => {
        const name = (document.getElementById('mpName').value || 'Operador').trim();
        const code = (document.getElementById('mpCode').value || '').trim().toUpperCase();
        if (!code) { this.errorMsg = 'Digite o código da sala.'; this.openMenu(); return; }
        this.setPlayerName(name);
        this.connect(() => this.send({ type: 'join_room', name, code }));
      };
    },

    showLobby() {
      const me = this.players.find((p) => p.id === this.selfId);
      const isHost = me ? me.isHost : false;
      const allReady = this.players.length > 0 && this.players.every((p) => p.ready);

      let slotsHtml = '';
      for (let i = 0; i < 4; i++) {
        const p = this.players[i];
        if (p) {
          slotsHtml +=
            '<div class="mp-slot">' +
            '<div class="mp-slot-left">' +
            '<span class="mp-dot" style="background:' + p.color + '"></span>' +
            '<span>' + p.name + (p.id === this.selfId ? ' (você)' : '') + '</span>' +
            (p.isHost ? '<span class="mp-badge host">HOST</span>' : '') +
            '</div>' +
            '<span class="mp-badge ' + (p.ready ? 'ready' : 'wait') + '">' + (p.ready ? 'PRONTO' : 'AGUARDANDO') + '</span>' +
            '</div>';
        } else {
          slotsHtml += '<div class="mp-slot empty"><span>Vaga livre (' + (i + 1) + '/4)</span><span>---</span></div>';
        }
      }

      showOverlay(
        '<div class="panel mp-panel">' +
        '<div class="tag">SALA MULTIPLAYER</div>' +
        '<div class="mp-code-box"><span>C&Oacute;DIGO:</span><b>' + this.roomCode + '</b></div>' +
        '<div class="mp-players">' + slotsHtml + '</div>' +
        '<div class="mp-error">' + (this.errorMsg || '') + '</div>' +
        '<div class="row-btns center">' +
        (me && !isHost ? '<button id="mpReady" class="btn">' + (me.ready ? 'CANCELAR PRONTO' : 'ESTOU PRONTO') + '</button>' : '') +
        (isHost ? '<button id="mpStart" class="btn"' + (allReady ? '' : ' disabled style="opacity:.45;cursor:not-allowed;"') + '>INICIAR CORRIDA</button>' : '') +
        '<button id="mpLeave" class="btn ghost">SAIR</button>' +
        '</div>' +
        (isHost && !allReady ? '<p class="hint">Aguardando todos os jogadores clicarem em ESTOU PRONTO...</p>' : '') +
        '</div>'
      );
      this.errorMsg = '';

      const btnReady = document.getElementById('mpReady');
      if (btnReady) btnReady.onclick = () => this.send({ type: 'toggle_ready' });

      const btnStart = document.getElementById('mpStart');
      if (btnStart) btnStart.onclick = () => this.send({ type: 'start_game' });

      document.getElementById('mpLeave').onclick = () => {
        if (this.ws) { this.ws.close(); this.ws = null; }
        this.enabled = false;
        this.status = 'idle';
        showStart();
      };
    },

    showWaitingPanel(myDist) {
      showOverlay(
        '<div class="panel mp-panel">' +
        '<div class="tag">FIM DA SUA CORRIDA</div>' +
        '<h2>VOC&Ecirc; BATEU!</h2>' +
        '<p class="sub">Sua dist&acirc;ncia: <b>' + myDist + 'm</b><br>Aguardando os outros operadores terminarem para ver o p&oacute;dio...</p>' +
        '</div>'
      );
    },

    showRaceOver(ranking) {
      const medals = ['&#129351;', '&#129352;', '&#129353;', '4&ordm;'];
      const rows = ranking.map((r, idx) =>
        '<div class="mp-podium-row' + (idx === 0 ? ' first' : '') + '">' +
        '<div class="mp-slot-left">' +
        '<span>' + (medals[idx] || (idx + 1) + '&ordm;') + '</span>' +
        '<span class="mp-dot" style="background:' + r.color + '"></span>' +
        '<span>' + r.name + (r.id === this.selfId ? ' (você)' : '') + '</span>' +
        '</div>' +
        '<b>' + r.distance + 'm</b>' +
        '</div>'
      ).join('');

      showOverlay(
        '<div class="panel mp-panel">' +
        '<div class="tag">CORRIDA FINALIZADA</div>' +
        '<h2>P&Oacute;DIO DA OBRA</h2>' +
        '<div class="mp-podium">' + rows + '</div>' +
        '<div class="row-btns center">' +
        '<button id="mpBackLobby" class="btn">VOLTAR AO LOBBY</button>' +
        '<button id="mpExit" class="btn ghost">SAIR</button>' +
        '</div>' +
        '</div>'
      );
      document.getElementById('mpBackLobby').onclick = () => {
        this.send({ type: 'back_to_lobby' });
        this.status = 'lobby';
        this.showLobby();
      };
      document.getElementById('mpExit').onclick = () => {
        if (this.ws) { this.ws.close(); this.ws = null; }
        this.enabled = false;
        this.status = 'idle';
        showStart();
      };
    },

    tick(dt) {
      if (this.status !== 'playing') return;
      this.sendAccum += dt;
      if (this.sendAccum >= 0.05) {
        this.sendAccum = 0;
        this.send({
          type: 'state',
          distance: Math.floor(dist),
          y: Math.round(bob.y),
          duck: false,
          impl: equippedId || null,
          alive: !bob.dead
        });
        this.renderHud();
      }
    },

    renderHud() {
      if (this.status !== 'playing') return;
      const list = [];
      const me = this.players.find((p) => p.id === this.selfId);
      list.push({
        name: me ? me.name : 'Você',
        color: me ? me.color : '#f0821e',
        distance: Math.floor(dist),
        alive: !bob.dead
      });
      for (const opp of this.opponents.values()) {
        list.push({
          name: opp.name,
          color: opp.color,
          distance: Math.floor(opp.distance),
          alive: opp.alive
        });
      }
      list.sort((a, b) => b.distance - a.distance);
      mpHud.innerHTML = list.map((item) =>
        '<div class="mp-hud-row' + (item.alive ? '' : ' dead') + '">' +
        '<span style="display:flex;align-items:center;gap:4px;"><span class="mp-dot" style="width:7px;height:7px;background:' + item.color + '"></span>' + item.name.slice(0, 9) + '</span>' +
        '<b>' + item.distance + 'm</b>' +
        '</div>'
      ).join('');
    },

    drawOpponents() {
      if (this.status !== 'playing') return;
      for (const opp of this.opponents.values()) {
        const dx = opp.distance - dist;
        const ox = Math.round(bob.x + dx);
        if (ox < -60 || ox > W + 60) continue;
        ctx.save();
        ctx.globalAlpha = opp.alive ? 0.65 : 0.25;
        const pre = opp.impl === 'pa' ? 'bob_pa_' : opp.impl === 'martelo' ? 'bob_ma_' : 'bob_';
        const f = Math.floor(time * 10) % 2;
        const sprName = pre + 'a' + (f + 1);
        drawSprite(sprName, ox, opp.y, false);
        ctx.fillStyle = opp.color;
        ctx.font = 'bold 7px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(opp.name.slice(0, 10), ox + 22, Math.max(12, opp.y - 4));
        ctx.restore();
      }
    }
  };

  window.mp = mp;
})();
</script>
</body>
</html>
